<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body id="index">
    <!-- Login  -->
    <div id="login-container">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> livestock Login</h2>
            <p>Welcome back! Please log in to your account.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Login</button>
                <p id="login-error"></p>
            </form>
        </div>
    </div>
    <!-- Main Application Container (Hidden by default) -->
    <div class="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-cow"></i> FarmFlow</h3>
                <div class="theme-toggler">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="livestock.html" class="nav-link"><i class="fa-solid fa-hippo"></i> Livestock</a>
                <a href="finance.html" class="nav-link"><i class="fas fa-dollar-sign"></i> Finance</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>


   
</body>
</html>
