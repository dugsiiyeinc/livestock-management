<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance - Livestock Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body id="finance">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-cow"></i> xoolo care</h3>
                <div class="theme-toggler">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="livestock.html" class="nav-link"><i class="fa-solid fa-hippo"></i> Livestock</a>
                <a href="finance.html" class="nav-link active"><i class="fas fa-dollar-sign"></i> Finance</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Financial Records</h1>
                <p>Track your farm's income and expenses.</p>
            </header>

            <div class="finance-summary dashboard-cards">
                 <div class="card card-income">
                    <h4>Total Income</h4>
                    <p id="finance-total-income">$0</p>
                </div>
                <div class="card card-expenses">
                    <h4>Total Expenses</h4>
                    <p id="finance-total-expenses">$0</p>
                </div>
                <div class="card card-profit">
                    <h4>Net Profit</h4>
                    <p id="finance-net-profit">$0</p>
                </div>
            </div>
              <div class="finance-columns">
                <!-- Income Section -->
                <section class="form-container">
                    <form id="income-form">
                        <h3><i class="fas fa-plus-circle"></i> Add Income Record</h3>
                        <div class="form-group">
                            <label for="income-source">Source of Income</label>
                            <input type="text" id="income-source" placeholder="Shayga la iibyey" required>
                        </div>
                        <div class="form-group">
                            <label for="income-amount">Amount</label>
                            <input type="number" id="income-amount" placeholder="100" min="0" required>
                        </div>
                        <button type="submit">Add Income</button>
                    </form>
                    <div class="table-container">
                        <h4>Income History</h4>
                        <table id="income-table">
                            <thead><tr><th>Source</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead>
                            <tbody id="income-table-body"></tbody>
                        </table>
                    </div>
                </section>
      <!-- Expenses Section -->
                <section class="form-container">
                    <form id="expenses-form">
                        <h3><i class="fas fa-minus-circle"></i> Add Expense Record</h3>
                        <div class="form-group">
                            <label for="expense-name">Expense Name</label>
                            <input type="text" id="expense-name" placeholder="tusale: calafka xoloha" required>
                        </div>
                        <div class="form-group">
                            <label for="expense-amount">Amount</label>
                            <input type="number" id="expense-amount" placeholder="50" min="0" required>
                        </div>
                        <button type="submit">Add Expense</button>
                    </form>
                     <div class="table-container">
                        <h4>Expense History</h4>
                        <table id="expenses-table">
                           <thead><tr><th>Expense</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead>
                            <tbody id="expenses-table-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
