<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock - Livestock Management</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body id="livestock">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-cow"></i> xoolo care</h3>
                <div class="theme-toggler">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="livestock.html" class="nav-link active"><i class="fa-solid fa-hippo"></i> Livestock</a>
                <a href="finance.html" class="nav-link"><i class="fas fa-dollar-sign"></i> Finance</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h1>Livestock Management</h1>
                <p>Add, edit, and track your farm animals.</p>
            </header>

            <!-- Add/Edit Animal Form -->
            <section class="form-container">
                <form id="livestock-form">
                    <input type="hidden" id="animal-id">
                    <h3>Add or Edit Animal</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="animal-type">Animal Type</label>
                            <select id="animal-type" required>
                                <option value="">Select Type</option>
                                <option value="Cow">Geel</option>
                                <option value="Goat">Lo'</option>
                                <option value="Sheep">Ari</option>
                                <option value="Chicken">Ido</option>
                                <option value="Pig">Digaag</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="animal-breed">Breed</label>
                            <input type="text" id="animal-breed" placeholder="tusale: nooc gaar ah" required>
                        </div>
                         <div class="form-group">
                            <label for="animal-quantity">Quantity</label>
                            <input type="number" id="animal-quantity" min="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label for="health-status">Health Status</label>
                            <select id="health-status" required>
                                <option value="Healthy">Healthy</option>
                                <option value="Sick">Sick</option>
                                <option value="Under Treatment">Under Treatment</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submit-livestock-btn">Add Animal</button>
                        <button type="button" id="cancel-edit-btn" class="hidden">Cancel Edit</button>
                    </div>
                </form>
            </section>
            
            <!-- Livestock List -->
            <section id="livestock-list-section">
                <h3>Current Livestock</h3>
                <div class="filter-controls">
                    <input type="text" id="search-livestock" placeholder="Search by type or breed...">
                    <select id="filter-health">
                        <option value="all">All Statuses</option>
                        <option value="Healthy">Healthy</option>
                        <option value="Sick">Sick</option>
                        <option value="Under Treatment">Under Treatment</option>
                    </select>
                </div>
                <div class="table-container">
                    <table id="livestock-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Breed</th>
                                <th>Quantity</th>
                                <th>Date Added</th>
                                <th>Health</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="livestock-table-body">
                            <!-- Data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
